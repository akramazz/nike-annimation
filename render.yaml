services:
  - type: web
    name: nike-annimation
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_API_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://nike-annimation.onrender.com
    autoDeploy: true